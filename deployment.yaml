apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-management
  template:
    metadata:
      labels:
        app: library-management
    spec:
      containers:
        - name: library-management
          image: library-management:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
